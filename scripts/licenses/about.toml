# cargo-about settings for THIRD_PARTY_NOTICES.txt (see generate.mjs).
# Every license the shipped Rust crates use must be listed here; a new one
# makes generation fail so it gets looked at before a release.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
]
# One notice file for every installer: cover the crates of all three platforms.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Tests and build tools are not shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Dual Pal's own crates are covered by its LICENSE.
private = { ignore = true }
