[workspace]
resolver = "2"
members = ["crates/dualpal-core", "crates/dualpal-testkit", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dualpal-core = { path = "crates/dualpal-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
dirs = "6"
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] }
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
russh = "0.65"
russh-sftp = "3"
regex = "1"
notify = "8"
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
bytes = "1"
opendal = { version = "0.55", features = ["services-s3", "services-webdav"] }
# The optional master password: Argon2id stretches it into an AES-256-GCM key
# that encrypts the saved connection secrets.
argon2 = "0.6"
aes-gcm = "0.11"
base64 = "0.22"
getrandom = "0.3"
# Archive browsing (read-only): pure-Rust readers for zip, tar (gz, bz2, xz, zst) and 7z.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd"] }
ruzstd = "0.9"
# RAR (read only): the official UnRAR C++ source, under the UnRAR license
# (free to ship; forbids using it to make a RAR compressor).
unrar_sys = "0.5"
zeroize = "1"
# Linux: the Secret Service (GNOME Keyring, KWallet) keeps passwords across
# logins; the kernel keyring alone forgets them at logout.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }

# Argon2id is deliberately slow; unoptimized it makes every unlock in a debug
# build (and every vault test) take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
