[workspace]
resolver = "2"
members = ["crates/dualpal-core", "crates/dualpal-testkit", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dualpal-core = { path = "crates/dualpal-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
dirs = "6"
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] }
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
russh = "0.65"
russh-sftp = "3"
regex = "1"
notify = "8"
suppaftp = { version = "12", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
bytes = "1"
opendal = { version = "0.55", features = ["services-s3", "services-webdav"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
