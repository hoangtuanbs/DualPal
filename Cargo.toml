[workspace]
resolver = "2"
members = ["crates/dualpal-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dualpal-core = { path = "crates/dualpal-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
dirs = "6"
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] }
futures-lite = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
russh = "0.65"
russh-sftp = "3"
opendal = { version = "0.55", features = ["services-s3"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native"] }
