[workspace]
resolver = "2"
members = ["crates/dualpal-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dualpal-core = { path = "crates/dualpal-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
trash = "5"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
dirs = "6"
