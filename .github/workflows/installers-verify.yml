name: Installers verify

on:
  workflow_run:
    workflows: ["Build installers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Run id of the "Build installers" workflow
        required: false

permissions:
  contents: read
  actions: read

jobs:
  version-consistency:
    name: Version consistency (INS-001)
    # Only verify builds that succeeded (or a run picked by hand).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux]
    steps:
      # Files a container wrote as root (or a cancelled job left behind) make
      # actions/checkout fail on a self-hosted runner, which reuses its work
      # folder: hand anything not owned by the runner user back to it.
      - name: Reclaim workspace
        if: runner.os == 'Linux'
        run: |
          ws="${{ github.workspace }}"
          if [ -d "$ws" ] && find "$ws" ! -user "$(id -u)" -print -quit | grep -q .; then
            docker run --rm -v "$ws:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - uses: actions/checkout@v4
      - name: Check the three versions agree
        run: bash scripts/release/check-version.sh

  linux:
    name: Linux (${{ matrix.distro }})
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu:24.04, debian:12, fedora:41, opensuse/tumbleweed, ubuntu:22.04]
    runs-on: [self-hosted, Linux]
    container: ${{ matrix.distro }}
    defaults:
      run:
        shell: bash
    steps:
      # Files a container wrote as root (or a cancelled job left behind) make
      # actions/checkout fail on a self-hosted runner, which reuses its work
      # folder: hand anything not owned by the runner user back to it.
      - name: Reclaim workspace
        if: runner.os == 'Linux'
        run: |
          ws="${{ github.workspace }}"
          if [ -d "$ws" ] && find "$ws" ! -user "$(id -u)" -print -quit | grep -q .; then
            docker run --rm -v "$ws:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - uses: actions/checkout@v4
      # The openSUSE image has no `find`, which the steps below and
      # linux.sh use.
      - name: Container tools
        run: command -v find >/dev/null || zypper --non-interactive install findutils
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: DualPal-Linux
          path: installers
          # The installers come from the "Build installers" run, not this one.
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Flatten bundle folders
        shell: bash
        run: find installers -mindepth 2 -type f -exec mv {} installers/ \;
      - name: Install and smoke-test
        run: bash scripts/installer-tests/linux.sh installers

  windows:
    name: Windows (${{ matrix.kind }})
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        kind: [nsis, msi]
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: DualPal-Windows
          path: installers
          # The installers come from the "Build installers" run, not this one.
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Flatten bundle folders
        shell: bash
        run: find installers -mindepth 2 -type f -exec mv {} installers/ \;
      # INS-WIN-006: the last release's MSI, to check an upgrade keeps one
      # Programs and Features entry. None yet (first release): skipped.
      - name: Download the previous release MSI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.msi' --dir previous || echo "no previous release"
      - name: Install and smoke-test
        shell: pwsh
        run: |
          $prev = Get-ChildItem previous -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          $arg = if ($prev) { @("-PreviousMsi", $prev.FullName) } else { @() }
          powershell -File scripts/installer-tests/windows.ps1 -ArtifactDir installers @arg

  macos:
    name: macOS (dmg smoke)
    needs: version-consistency
    runs-on: avrea-macos-26-8-vcpu  # Avrea macOS runner
    steps:
      - uses: actions/checkout@v4
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: DualPal-macOS
          path: installers
          # The installers come from the "Build installers" run, not this one.
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          github-token: ${{ github.token }}
      - name: Flatten bundle folders
        shell: bash
        run: find installers -mindepth 2 -type f -exec mv {} installers/ \;
      - name: Mount and verify the dmg
        run: bash scripts/installer-tests/macos.sh installers
