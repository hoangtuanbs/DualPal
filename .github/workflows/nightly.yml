name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  flake-hunt:
    name: Flake hunt (REL-001)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - name: Rust tests with retries
        run: cargo nextest run --workspace --profile nightly -E 'not (binary(remote) | binary(contract_remote) | binary(remote_extra))'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright repeat-each
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: npx playwright test --repeat-each 3 --project=chromium --reporter=list,json
      # Tests that passed only on a retry (Rust) or on some repeats (UI) go to
      # the job summary and to one open "Flaky tests" issue.
      - name: Report flaky tests
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$(node scripts/ci/flaky-report.mjs --junit target/nextest/nightly/junit.xml --playwright playwright-report.json)"
          if [ -z "$report" ]; then
            echo "No flaky tests tonight." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "## Flaky tests"; echo; echo "$report"; } >> "$GITHUB_STEP_SUMMARY"
          body="$(printf 'Nightly run %s/%s/actions/runs/%s found:\n\n%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$report")"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Flaky tests" in:title' --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Flaky tests" --body "$body"
          fi

  remote-chaos:
    name: Remote under latency (REL-002)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - run: docker compose -f docker/test-servers/compose.yaml up -d --build --wait --wait-timeout 180
      - name: Export server settings, routed through Toxiproxy
        run: |
          cp docker/test-servers/keys/id_ed25519 "$RUNNER_TEMP/dualpal_sftp_key"
          chmod 600 "$RUNNER_TEMP/dualpal_sftp_key"
          scripts/ci/remote-env.sh >> "$GITHUB_ENV"
          # Later lines win in GITHUB_ENV: point FTP, WebDAV and S3 at their
          # proxies. (FTP data connections stay direct; see plan §7.3.)
          {
            echo "DUALPAL_TEST_FTP=tester:dualpal@127.0.0.1:3121"
            echo "DUALPAL_TEST_WEBDAV=tester:dualpal@http://127.0.0.1:9088/dav"
            echo "DUALPAL_TEST_S3=http://127.0.0.1:9900|dualpal-test|test|test-secret"
          } >> "$GITHUB_ENV"
      - name: Add 200 ms latency to every proxy
        run: |
          for p in ftp-proxy webdav-proxy s3-proxy; do
            curl -fsS -X POST "http://127.0.0.1:8474/proxies/$p/toxics" \
              -H 'Content-Type: application/json' \
              -d '{"name":"latency","type":"latency","stream":"downstream","attributes":{"latency":200}}'
          done
      - run: cargo nextest run -p dualpal-core --profile nightly -E 'binary(contract_remote)'

  perf:
    name: Performance baseline (PERF)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Criterion benches
        run: cargo bench -p dualpal-core

  upgrade:
    name: Upgrade from the last release (INS-LNX-004)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download the last release and the newest main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev installers
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir prev; then
            echo "no release yet: nothing to upgrade from" >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP_UPGRADE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          read -r run sha < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch main --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name DualPal-Linux --dir installers
          # Test with the scripts and version of the commit that build came from.
          git fetch --depth 1 origin "$sha"
          git checkout --detach FETCH_HEAD
          find installers -mindepth 2 -type f -exec mv {} installers/ \;
      - name: Install the last release, then upgrade
        if: env.SKIP_UPGRADE != '1'
        run: |
          export DUALPAL_PREVIOUS_DEB="$(ls "$PWD"/prev/*.deb | head -n 1)"
          bash scripts/installer-tests/linux.sh installers
