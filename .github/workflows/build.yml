name: Build installers

# Builds installers for macOS, Windows and Linux. Every run keeps them under
# "Artifacts" on the run page; pushing a version tag such as v0.2.0 also
# publishes them on a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: DualPal-macOS
            paths: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
            artifact: DualPal-Windows
            paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - name: Linux
            os: ubuntu-24.04
            args: --bundles appimage,deb,rpm
            rust-targets: ""
            artifact: DualPal-Linux
            paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - run: npm ci

      - name: Build installer
        run: npx tauri build ${{ matrix.args }}

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts keep their bundle subfolders (msi/, nsis/, deb/...),
          # so collect the installer files from every level.
          mapfile -t files < <(find installers -type f)
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dual Pal ${GITHUB_REF_NAME#v}" \
            --generate-notes
