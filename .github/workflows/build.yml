name: Build installers

# Builds installers for macOS, Windows and Linux. Every run keeps them under
# "Artifacts" on the run page; pushing a version tag such as v0.2.0 also
# publishes them on a GitHub Release.
#
# Updater files: when the repository secret TAURI_SIGNING_PRIVATE_KEY is set,
# builds also sign the installers (.sig files), and a tag push adds latest.json
# to the release so the app can update itself. Without the secret, everything
# builds as before. See "Release signing setup" in README.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: DualPal-macOS
            paths: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
            artifact: DualPal-Windows
            paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - name: Linux
            os: ubuntu-24.04
            args: --bundles appimage,deb,rpm
            rust-targets: ""
            artifact: DualPal-Linux
            paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    env:
      # "true" when the signing key secret is set (secrets cannot be used in `if`).
      UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle

      - run: npm ci

      - name: Build installer
        if: env.UPDATER_SIGNING != 'true'
        run: npx tauri build ${{ matrix.args }}

      - name: Build installer with updater files
        if: env.UPDATER_SIGNING == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          npx tauri build ${{ matrix.args }} --config "$(node scripts/updater-manifest.mjs config)"

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # INS-001 and INS-REL-001: the versions agree and match the tag.
        run: bash scripts/release/check-version.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts keep their bundle subfolders (msi/, nsis/, deb/...),
          # so collect the installer files from every level.
          # A plain assignment so the script failing (no installers) stops the step.
          installer_list="$(bash scripts/release/collect-installers.sh installers)"
          mapfile -t files <<< "$installer_list"
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dual Pal ${GITHUB_REF_NAME#v}" \
            --generate-notes

  updater-manifest:
    name: Updater manifest (latest.json)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.UPDATER_SIGNING == 'true'

      - uses: actions/download-artifact@v4
        if: env.UPDATER_SIGNING == 'true'
        with:
          path: installers
          merge-multiple: true

      - name: Write latest.json and attach it to the release
        if: env.UPDATER_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/updater-manifest.mjs manifest \
            --dir installers --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --out latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
