name: Build installers

# Builds installers for macOS, Windows and Linux. Every run keeps them under
# "Artifacts" on the run page; pushing a version tag such as v0.2.0 also
# publishes them on a GitHub Release.
#
# Updater files: when the repository secret TAURI_SIGNING_PRIVATE_KEY is set,
# builds also sign the installers (.sig files), and a tag push adds latest.json
# to the release so the app can update itself. Without the secret, everything
# builds as before. See "Release signing setup" in README.md.
#
# Pushes to main and pull requests no longer start this workflow, so they use no
# GitHub-hosted runner minutes. It runs by hand (Actions tab, "Run workflow")
# or when a version tag is pushed for a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon + Intel)
            os: avrea-macos-26-8-vcpu  # Avrea macOS runner
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: DualPal-macOS
            paths: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: [self-hosted, Windows]
            args: ""
            rust-targets: ""
            artifact: DualPal-Windows
            paths: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
          - name: Linux
            # Register this runner on the oldest Ubuntu still supported (22.04):
            # the binary needs the glibc it was built against or newer, so a
            # 24.04 build does not start on 22.04 or Debian 12.
            os: [self-hosted, Linux]
            args: --bundles appimage,deb,rpm
            rust-targets: ""
            artifact: DualPal-Linux
            paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/appimage/*.AppImage.sig
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    env:
      # "true" when the signing key secret is set (secrets cannot be used in `if`).
      UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # Files a container wrote as root (or a cancelled job left behind) make
      # actions/checkout fail on a self-hosted runner, which reuses its work
      # folder: hand anything not owned by the runner user back to it.
      - name: Reclaim workspace
        if: runner.os == 'Linux'
        run: |
          ws="${{ github.workspace }}"
          if [ -d "$ws" ] && find "$ws" ! -user "$(id -u)" -print -quit | grep -q .; then
            docker run --rm -v "$ws:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/linux-deps.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Per runner image: objects built against a newer glibc's headers
          # (e.g. __isoc23_sscanf on 24.04) do not link on an older one.
          key: bundle-${{ matrix.artifact }}

      - run: npm ci

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The installers ship THIRD_PARTY_NOTICES.txt and the About window shows
      # it: rebuild it from the dependencies being built, so a release never
      # ships a list older than its Cargo.lock and package-lock.json.
      - name: Third-party license notices
        run: node scripts/licenses/generate.mjs

      - name: Build installer
        if: env.UPDATER_SIGNING != 'true'
        run: npx tauri build ${{ matrix.args }}

      - name: Build installer with updater files
        if: env.UPDATER_SIGNING == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          npx tauri build ${{ matrix.args }} --config "$(node scripts/updater-manifest.mjs config)"

      # TEMPORARY (test branch only): confirm each installer carries the notices.
      - name: Verify notices in installers
        shell: bash
        run: |
          set -u
          root=target/${{ matrix.args == '--target universal-apple-darwin' && 'universal-apple-darwin/' || '' }}release
          echo "== generated file"; head -3 THIRD_PARTY_NOTICES.txt; grep -c "^  " THIRD_PARTY_NOTICES.txt; grep -n "UnRAR, compiled" THIRD_PARTY_NOTICES.txt || echo "no UnRAR section"
          bin=$(ls $root/dualpal $root/dualpal.exe 2>/dev/null | head -1 || true)
          echo "== embedded in $bin: $(grep -a -c 'Dual Pal third-party notices' "$bin")"
          case "$RUNNER_OS" in
            macOS)
              ls -l "$root/bundle/macos/Dual Pal.app/Contents/Resources/" ;;
            Linux)
              for d in $root/bundle/deb/*.deb; do echo "== $d"; dpkg -c "$d" | grep -i notices; done
              for r in $root/bundle/rpm/*.rpm; do echo "== $r"; (rpm -qlp "$r" 2>/dev/null || bsdtar tf "$r") | grep -i notices; done
              for a in $root/bundle/appimage/*.AppImage; do echo "== $a"; (cd "$RUNNER_TEMP" && rm -rf squashfs-root && "$GITHUB_WORKSPACE/$a" --appimage-extract >/dev/null && find squashfs-root -iname '*notices*'); done ;;
            Windows)
              for m in $root/bundle/msi/*.msi; do echo "== $m"; out="$(cygpath -w "$RUNNER_TEMP")\\msi"; msiexec //a "$(cygpath -w "$m")" //qn TARGETDIR="$out"; sleep 5; find "$RUNNER_TEMP/msi" -iname '*notices*'; done
              echo "== NSIS script"; grep -i -r notices $root/nsis/*/installer.nsi ;;
          esac

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # INS-001 and INS-REL-001: the versions agree and match the tag.
        run: bash scripts/release/check-version.sh "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    steps:
      # Files a container wrote as root (or a cancelled job left behind) make
      # actions/checkout fail on a self-hosted runner, which reuses its work
      # folder: hand anything not owned by the runner user back to it.
      - name: Reclaim workspace
        if: runner.os == 'Linux'
        run: |
          ws="${{ github.workspace }}"
          if [ -d "$ws" ] && find "$ws" ! -user "$(id -u)" -print -quit | grep -q .; then
            docker run --rm -v "$ws:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts keep their bundle subfolders (msi/, nsis/, deb/...),
          # so collect the installer files from every level.
          # A plain assignment so the script failing (no installers) stops the step.
          installer_list="$(bash scripts/release/collect-installers.sh installers)"
          mapfile -t files <<< "$installer_list"
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dual Pal ${GITHUB_REF_NAME#v}" \
            --generate-notes

  updater-manifest:
    name: Updater manifest (latest.json)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    env:
      UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      # Files a container wrote as root (or a cancelled job left behind) make
      # actions/checkout fail on a self-hosted runner, which reuses its work
      # folder: hand anything not owned by the runner user back to it.
      - name: Reclaim workspace
        if: runner.os == 'Linux'
        run: |
          ws="${{ github.workspace }}"
          if [ -d "$ws" ] && find "$ws" ! -user "$(id -u)" -print -quit | grep -q .; then
            docker run --rm -v "$ws:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
          fi

      - uses: actions/checkout@v4
        if: env.UPDATER_SIGNING == 'true'

      - uses: actions/download-artifact@v4
        if: env.UPDATER_SIGNING == 'true'
        with:
          path: installers
          merge-multiple: true

      - name: Write latest.json and attach it to the release
        if: env.UPDATER_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/updater-manifest.mjs manifest \
            --dir installers --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --out latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
