name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: npm ci

      - name: Type-check UI
        run: npm run check

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Reports P0/P1 test IDs with no test yet. Add --strict once the
      # catalogue is fully implemented (plan §11.4).
      - name: Test ID traceability
        run: scripts/ci/trace-check.sh

  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install UI dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      # L1 + L2 + L4: everything except the remote suite, which needs the
      # servers. The `commands` binary (L4) is skipped on Windows because
      # `tauri::test` links the WebView2 loader there (see the L4 tests).
      - name: Core tests (L1 + L2 + L4)
        if: runner.os != 'Windows'
        run: >-
          cargo nextest run --workspace
          -E 'not (binary(remote) | binary(contract_remote) | binary(remote_extra))'

      - name: Core tests (L1 + L2, Windows)
        if: runner.os == 'Windows'
        run: >-
          cargo nextest run --workspace
          -E 'not (binary(remote) | binary(contract_remote) | binary(remote_extra) | binary(commands))'

      - name: Build app (no installer)
        run: npx tauri build --debug --no-bundle

  rust-remote:
    name: Remote (L3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Start test servers
        run: docker compose -f docker/test-servers/compose.yaml up -d --build --wait --wait-timeout 180

      - name: Export server settings
        run: |
          cp docker/test-servers/keys/id_ed25519 "$RUNNER_TEMP/sftp_key"
          chmod 600 "$RUNNER_TEMP/sftp_key"
          scripts/ci/remote-env.sh >> "$GITHUB_ENV"

      - name: Remote tests (shared servers, in parallel)
        run: >-
          cargo nextest run -p dualpal-core --profile ci
          -E '(binary(remote) | binary(contract_remote) | binary(remote_extra)) - test(/fault_/)'

      - name: Fault tests (cut or slow every connection, one at a time)
        run: >-
          cargo nextest run -p dualpal-core --profile ci
          -E '(binary(remote) | binary(contract_remote)) & test(/fault_/)'
          --test-threads 1 --no-tests=warn

      - name: Collect server logs
        if: failure()
        run: docker compose -f docker/test-servers/compose.yaml logs > servers.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-remote-results
          path: |
            target/nextest/ci/junit.xml
            servers.log

  ui-unit:
    name: UI unit (L5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check UI
        run: npm run check

      - name: Unit and component tests (with coverage)
        run: npm run test:unit

  ui-e2e:
    name: UI E2E (L6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests (mocked backend)
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
