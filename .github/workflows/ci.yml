name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: npm ci

      - name: Type-check UI
        run: npm run check

      - name: Build UI
        run: npm run build

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test SSH and S3 servers (Linux)
        if: runner.os == 'Linux'
        run: |
          # The throwaway servers in docker/test-servers, on 127.0.0.1.
          docker compose -f docker/test-servers/compose.yaml up -d --build --wait
          for i in $(seq 1 60); do
            docker logs dualpal-test-s3 2>&1 | grep -q 'bucket dualpal-test ready' && break; sleep 1
          done
          for i in $(seq 1 30); do [ -f docker/test-servers/keys/id_ed25519 ] && break; sleep 1; done
          cp docker/test-servers/keys/id_ed25519 "$RUNNER_TEMP/sftp_key"
          chmod 600 "$RUNNER_TEMP/sftp_key"
          echo "DUALPAL_TEST_SFTP=tester@127.0.0.1:2222" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_SFTP_KEY=$RUNNER_TEMP/sftp_key" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_SFTP_PASSWORD=dualpal" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_SFTP_DROP=docker exec dualpal-test-sftp drop-connections" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_S3=http://127.0.0.1:9000|dualpal-test|test|test-secret" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do docker logs dualpal-test-ftp 2>&1 | grep -q 'ftp ready' && break; sleep 1; done
          echo "DUALPAL_TEST_FTP=tester:dualpal@127.0.0.1:2121" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_FTPS=tester:dualpal@127.0.0.1:2990" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_FTPS_IMPLICIT=tester:dualpal@127.0.0.1:2991" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_WEBDAV=tester:dualpal@http://127.0.0.1:8088/dav" >> "$GITHUB_ENV"

      - name: Core tests
        run: cargo test --workspace

      - name: Build app (no installer)
        run: npx tauri build --debug --no-bundle
