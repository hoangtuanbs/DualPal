name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        run: npm ci

      - name: Type-check UI
        run: npm run check

      - name: Build UI
        run: npm run build

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test SSH server (Linux)
        if: runner.os == 'Linux'
        run: |
          # A throwaway sshd on 127.0.0.1:2222 for the SFTP integration test.
          sudo apt-get install -y openssh-server
          T="$RUNNER_TEMP/sshd"
          mkdir -p "$T"
          ssh-keygen -q -t ed25519 -N '' -f "$T/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$T/client_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$T/client_key.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          printf 'Port 2222\nListenAddress 127.0.0.1\nHostKey %s/host_key\nPidFile %s/sshd.pid\nPasswordAuthentication yes\nStrictModes no\nUsePAM no\nSubsystem sftp internal-sftp\n' "$T" "$T" > "$T/sshd_config"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$T/sshd_config"
          echo "DUALPAL_TEST_SFTP=$(whoami)@127.0.0.1:2222" >> "$GITHUB_ENV"
          echo "DUALPAL_TEST_SFTP_KEY=$T/client_key" >> "$GITHUB_ENV"

      - name: Core tests
        run: cargo test --workspace

      - name: Build app (no installer)
        run: npx tauri build --debug --no-bundle
