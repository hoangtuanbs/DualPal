[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
retries = 0
[profile.ci.junit]
path = "junit.xml"

[profile.nightly]
retries = 2
fail-fast = false
# REL-001: tests that pass only on a retry are listed from this report.
[profile.nightly.junit]
path = "junit.xml"

# Remote tests share servers: limit their parallelism.
# Tests that run DUALPAL_TEST_SFTP_DROP or add a Toxiproxy toxic affect every
# connection to that server, so they must be named `fault_*` and run in a
# separate, single-threaded invocation (see the rust-remote job). Running them
# alongside other remote tests makes those tests fail at random.
[[profile.default.overrides]]
filter = "binary(remote) | binary(contract_remote) | binary(remote_extra)"
threads-required = 2
test-group = "remote"

[test-groups]
remote = { max-threads = 4 }

# REL-002: the nightly job adds 200 ms to every FTP, WebDAV and S3 round trip.
# A full contract run then takes about 5 minutes on WebDAV and S3, and far
# longer on plain FTP, which opens a new connection for every file it writes
# (VFS-CON-025 writes 1000). Allow an hour instead of the default 2 minutes.
[[profile.nightly.overrides]]
filter = "binary(contract_remote)"
slow-timeout = { period = "60s", terminate-after = 60 }
